<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Workflow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
    <style>
        /* ── Two-column login layout ── */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
        }

        /* Left branding panel — ~1/3 width, same navy as dash-navbar */
        .login-left {
            width: 33.33%;
            min-height: 100vh;
            background: rgba(15, 23, 42, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 48px 40px;
            flex-shrink: 0;
        }

        .login-brand-word {
            font-size: 2.8rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }

        .login-brand-quote {
            color: rgba(255, 255, 255, 0.82);
            font-size: 1.05rem;
            font-weight: 400;
            line-height: 1.8;
        }

        /* Right form panel — ~2/3 width */
        .login-right {
            flex: 1;
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 32px;
        }

        .login-form-box {
            width: 100%;
            max-width: 420px;
        }

        .login-form-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #263449;
            margin-bottom: 28px;
            text-align: center;
        }

        /* Responsive: stack on small screens */
        @media (max-width: 700px) {
            body { flex-direction: column; }
            .login-left {
                width: 100%;
                min-height: auto;
                padding: 32px 24px;
                align-items: center;
                text-align: center;
            }
            .login-brand-word { font-size: 2rem; }
            .login-right { padding: 32px 20px; }
        }
    </style>
</head>
<body>

    <!-- Left: branding -->
    <div class="login-left">
        <div class="login-brand-word">workflow</div>
        <div class="login-brand-quote">
            Your projects,<br>
            Your team,<br>
            One Workflow.
        </div>
    </div>

    <!-- Right: login form (all existing fields, IDs, JS, and behavior preserved) -->
    <div class="login-right">
        <div class="login-form-box">

            <h1 class="login-form-title">Welcome Back</h1>

            <form id="loginForm" method="POST" action="/login">

                <div class="auth-form-group">
                    <label class="auth-label" for="email">Email</label>
                    <input
                        class="auth-input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="password">Password</label>
                    <input
                        class="auth-input"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="auth-button">Login</button>

                <!-- Message shown by JavaScript — id and class preserved -->
                <p id="message" class="auth-message"></p>

            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Register here</a>
            </div>

        </div>
    </div>

    <script>
        /* All existing JS preserved exactly — only the surrounding HTML changed */
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const email    = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message  = document.getElementById("message");
            message.textContent = "";
            message.className   = "auth-message";
            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, password: password })
                });
                const result = await response.json();
                if (response.ok) {
                    window.location.href = "/dashboard";
                } else {
                    message.textContent = result.error || "Login failed";
                    message.classList.add("error");
                }
            } catch (error) {
                message.textContent = "Unable to connect to the server";
                message.classList.add("error");
            }
        });
    </script>

</body>
</html>
