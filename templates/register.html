<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Workflow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
    <style>
        /* ── Two-column registration layout ── */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
        }

        /* Left branding panel — ~1/3 width */
        .reg-left {
            width: 33.33%;
            min-height: 100vh;
            background: rgba(15, 23, 42, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 48px 40px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            align-self: flex-start;
            height: 100vh;
        }

        .reg-brand-word {
            font-size: 2.8rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }

        .reg-brand-quote {
            color: rgba(255, 255, 255, 0.82);
            font-size: 1.05rem;
            font-weight: 400;
            line-height: 1.8;
        }

        /* Right form panel — ~2/3 width, scrollable */
        .reg-right {
            flex: 1;
            background: #f5f7fb;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 48px 32px 64px;
            overflow-y: auto;
        }

        .reg-form-box {
            width: 100%;
            max-width: 480px;
        }

        .reg-form-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #263449;
            margin-bottom: 28px;
            text-align: center;
        }

        /* Responsive: stack on small screens */
        @media (max-width: 700px) {
            body { flex-direction: column; }
            .reg-left {
                width: 100%;
                min-height: auto;
                padding: 28px 24px;
                align-items: center;
                text-align: center;
                position: static;
                height: auto;
            }
            .reg-brand-word { font-size: 1.8rem; }
            .reg-right { padding: 32px 20px 56px; }
        }
    </style>
</head>
<body>

    <!-- Left: branding -->
    <div class="reg-left">
        <div class="reg-brand-word">workflow</div>
        <div class="reg-brand-quote">
            Your projects,<br>
            and achieve more together.
        </div>
    </div>

    <!-- Right: registration form (all existing fields, IDs, validation, JS preserved) -->
    <div class="reg-right">
        <div class="reg-form-box">

            <!-- Changed title; removed "Join Smart Workflow..." subtitle as requested -->
            <h1 class="reg-form-title">Create Your Account</h1>

            <form id="register" method="POST" action="/register">

                <div class="auth-form-group">
                    <label class="auth-label" for="full_name">Full Name</label>
                    <input class="auth-input" type="text" id="full_name" name="full_name"
                        placeholder="Enter your full name" required autocomplete="name">
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="email">Email</label>
                    <input class="auth-input" type="email" id="email" name="email"
                        placeholder="Enter your email" required autocomplete="email">
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="password">Password</label>
                    <input class="auth-input" type="password" id="password" name="password"
                        placeholder="Enter your password" minlength="8" required
                        autocomplete="new-password">
                    <p class="auth-hint">
                        Must contain at least 8 characters, one uppercase (A–Z),
                        one lowercase (a–z), one number (0–9), and one special character.
                    </p>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="confirm_password">Confirm Password</label>
                    <input class="auth-input" type="password" id="confirm_password"
                        name="confirm_password" placeholder="Re-enter your password"
                        required autocomplete="new-password">
                </div>

                <!-- Company and Branch side by side -->
                <div class="auth-row">
                    <div class="auth-form-group">
                        <label class="auth-label" for="company_name">Company Name</label>
                        <input class="auth-input" type="text" id="company_name"
                            name="company_name" placeholder="Your company" required>
                    </div>
                    <div class="auth-form-group">
                        <label class="auth-label" for="branch">Branch / City</label>
                        <input class="auth-input" type="text" id="branch" name="branch"
                            placeholder="Your city or branch" required>
                    </div>
                </div>

                <!-- Gender and Date of Birth side by side -->
                <div class="auth-row">
                    <div class="auth-form-group">
                        <label class="auth-label" for="gender">Gender</label>
                        <select class="auth-select" id="gender" name="gender">
                            <option value="">Prefer not to say</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="auth-form-group">
                        <label class="auth-label" for="date_of_birth">Date of Birth</label>
                        <input class="auth-input" type="date" id="date_of_birth"
                            name="date_of_birth">
                    </div>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="role">Role</label>
                    <select class="auth-select" id="role" name="role" required>
                        <option value="">Select your role</option>
                        <option value="project_manager">Project Manager</option>
                        <option value="team_leader">Team Leader</option>
                        <option value="team_member">Team Member</option>
                    </select>
                </div>

                <button type="submit" class="auth-button">Register</button>

                <!-- id="message" and class preserved — used by existing JS -->
                <p id="message" class="auth-message" role="status"></p>

            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login">Login here</a>
            </div>

        </div>
    </div>

    <script>
        /* All existing JS preserved exactly — only the surrounding HTML layout changed */

        // Set the max date for date_of_birth to yesterday so future dates are blocked
        (function () {
            const dobInput = document.getElementById("date_of_birth");
            const today    = new Date();
            today.setDate(today.getDate() - 1);
            dobInput.max   = today.toISOString().split("T")[0];
        })();

        document.getElementById("register").addEventListener("submit", async function (event) {
            event.preventDefault();

            const full_name        = document.getElementById("full_name").value.trim();
            const email            = document.getElementById("email").value.trim();
            const password         = document.getElementById("password").value;
            const confirm_password = document.getElementById("confirm_password").value;
            const company_name     = document.getElementById("company_name").value.trim();
            const branch           = document.getElementById("branch").value.trim();
            const role             = document.getElementById("role").value;
            const gender           = document.getElementById("gender").value;
            const date_of_birth    = document.getElementById("date_of_birth").value;
            const message          = document.getElementById("message");

            message.textContent = "";
            message.className   = "auth-message";

            const password_pattern =
                /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9\s]).{8,}$/;

            if (!password_pattern.test(password)) {
                message.textContent =
                    "Password must contain at least 8 characters, one uppercase letter, " +
                    "one lowercase letter, one number, and one special character.";
                message.classList.add("error");
                return;
            }

            if (password !== confirm_password) {
                message.textContent = "Passwords do not match.";
                message.classList.add("error");
                return;
            }

            if (date_of_birth) {
                const dob   = new Date(date_of_birth);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                if (dob >= today) {
                    message.textContent = "Date of birth must be in the past.";
                    message.classList.add("error");
                    return;
                }
            }

            message.textContent = "Registering...";

            try {
                const response = await fetch("/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        full_name:     full_name,
                        email:         email,
                        password:      password,
                        company_name:  company_name,
                        branch:        branch,
                        role:          role,
                        gender:        gender || null,
                        date_of_birth: date_of_birth || null
                    })
                });

                let result = {};
                try {
                    result = await response.json();
                } catch (parseErr) {
                    message.textContent = "Server error (HTTP " + response.status + "). Please try again.";
                    message.classList.add("error");
                    return;
                }

                if (response.ok) {
                    message.textContent = "Registration successful! Redirecting...";
                    message.classList.add("success");
                    window.location.href = "/login";
                } else {
                    message.textContent = result.error || "Registration failed.";
                    message.classList.add("error");
                }
            } catch (error) {
                message.textContent = "Unable to connect to server. Check your internet connection.";
                message.classList.add("error");
            }
        });
    </script>

</body>
</html>
